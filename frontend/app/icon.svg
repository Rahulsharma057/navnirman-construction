<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Navnirman Construction">
  <rect width="120" height="120" rx="14" fill="#1C2321"/>
  <rect x="8" y="8" width="104" height="104" rx="9" fill="none" stroke="#B3491A" stroke-width="2"/>
  <!-- rising sun / new-build arch (Nav = new, Nirman = construction) -->
