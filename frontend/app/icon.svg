  <path d="M60 10 L60 20 M36 18 L42 26 M84 18 L78 26" stroke="#B3491A" stroke-width="3" stroke-linecap="round"/>
  <!-- bold N built from girders -->
  <path d="M34 90 V44 H46 L74 74 V44 H86 V90 H74 L46 60 V90 Z" fill="#B3491A"/>
  <path d="M34 96 H86" stroke="#EDE8DE" stroke-width="4" stroke-linecap="round"/>
  <path d="M46 96 v6 M60 96 v6 M74 96 v6" stroke="#EDE8DE" stroke-width="2" stroke-linecap="round" opacity=".6"/>
</svg>
